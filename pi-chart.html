<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chrome Screentime</title>
    <script src="lib/chart.umd.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        background: #fff;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 2px;
      }
      .subtitle {
        font-size: 12px;
        color: #666;
        margin: 0 0 12px;
      }
      #total {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      #total-label {
        font-size: 12px;
        color: #666;
        margin: 0 0 12px;
      }
      #chart-wrap {
        position: relative;
        height: 180px;
        margin-bottom: 8px;
      }
      #empty {
        display: none;
        padding: 24px 0;
        text-align: center;
        color: #666;
        font-size: 13px;
      }
      #top-list {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
        font-size: 13px;
      }
      #top-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      #top-list li:last-child { border-bottom: none; }
      #top-list .domain {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #top-list .time { color: #666; flex-shrink: 0; }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #f6f6f6; }
      button.primary {
        background: #1a1a1a;
        color: #fff;
        border-color: #1a1a1a;
      }
      button.primary:hover { background: #333; }
    </style>
  </head>
  <body>
    <h1>Today's screen time</h1>
    <p class="subtitle">Tracked locally on this device. Nothing leaves Chrome.</p>
    <p id="total">0s</p>
    <p id="total-label">total time on tracked sites today</p>
    <div id="chart-wrap"><canvas id="pieChart"></canvas></div>
    <p id="empty">No tracked browsing yet today.<br>Open a site and come back.</p>
    <ol id="top-list"></ol>
    <div class="row">
      <button id="switchChartButton">Switch to Domains</button>
      <button id="openDashboard" class="primary">Open full dashboard</button>
    </div>
    <script src="dictionary.js"></script>
    <script src="categories.js"></script>
    <script src="pieChart.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
